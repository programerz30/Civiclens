<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Benefit Eligibility Checker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .result-box { display: none; }
        .loading { display: none; }
        .file-upload-area { 
            border: 2px dashed #ccc; 
            border-radius: 5px; 
            padding: 20px; 
            text-align: center;
            cursor: pointer;
            margin-bottom: 15px;
        }
        .file-upload-area:hover { border-color: #0066cc; background: #f8f9fa; }
        .file-list { margin-top: 10px; }
        .file-item { 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            padding: 8px;
            border: 1px solid #dee2e6;
            border-radius: 4px;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold text-primary" href="#">Portal.AI</a>
            <div class="ms-auto" id="authSection">
                <div id="loggedOutUI">
                    <button class="btn btn-outline-primary me-2" data-bs-toggle="modal" data-bs-target="#loginModal">Log In</button>
                </div>
                <div id="loggedInUI" style="display: none;">
                    <div class="dropdown">
                        <a class="dropdown-toggle d-flex align-items-center text-decoration-none" href="#" id="profileDropdown" data-bs-toggle="dropdown">
                            <div class="bg-primary text-white rounded-circle d-flex align-items-center justify-content-center me-2" style="width: 35px; height: 35px;">
                                <i class="fas fa-user"></i>
                            </div>
                            <span id="userEmailDisplay" class="text-dark small"></span>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item" href="#" id="logoutBtn">Sign Out</a></li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <div class="container mt-2">
        <h1 class="text-center mb-4">🏛️ Benefit Eligibility Portal</h1>
        
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h4>Submit Your Application</h4>
            </div>
            <div class="card-body">
                <form id="benefitForm">
                    <div class="row mb-4">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Full Name *</label>
                            <input type="text" class="form-control" id="name" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Email Address *</label>
                            <input type="email" class="form-control" id="email" required>
                        </div>
                    </div>
                    
                    <div class="mb-4">
                        <label class="form-label">Type of Assistance Needed *</label>
                        <select class="form-control" id="issueType" required>
                            <option value="">Select an issue type</option>
                            <option value="income-support">Income Support / Financial Assistance</option>
                            <option value="disability-benefits">Disability Benefits</option>
                            <option value="housing-assistance">Housing Assistance</option>
                            <option value="medical-aid">Medical Aid / Healthcare</option>
                            <option value="food-assistance">Food Assistance (SNAP/WIC)</option>
                        </select>
                    </div>
                    
                    <div class="mb-4">
                        <label class="form-label fw-bold">1. Upload Application Form (PDF) *</label>
                        <div class="file-upload-area" onclick="document.getElementById('applicationPdf').click()">
                            <i class="fas fa-cloud-upload-alt fa-3x text-muted"></i>
